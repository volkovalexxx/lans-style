# Link-preview crawlers get server-rendered OG tags for product pages.
# ?web=1 is the escape hatch if an in-app browser is mistaken for a crawler.
map $http_user_agent $share_bot {
    default 0;
    ~*(facebookexternalhit|facebot|meta-externalagent|telegrambot|whatsapp|viber|vkshare|twitterbot|slackbot|linkedinbot|discordbot|skypeuripreview|odklbot|pinterestbot) 1;
}
map "$share_bot:$arg_web" $serve_share {
    default 0;
    "1:" 1;
}
server {
    listen 80;
    server_name www.lans-style.by;
    return 301 https://lans-style.by$request_uri;
}
server {
    listen 80 default_server;
    server_name lans-style.by;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.lans-style.by;
    ssl_certificate /etc/letsencrypt/live/lans-style.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lans-style.by/privkey.pem;
    client_max_body_size 50m;
    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        proxy_pass http://server:5000/uploads/;
        expires 30d;
    }
    location / {
        return 301 https://lans-style.by$request_uri;
    }
}
server {
    listen 443 ssl http2 default_server;
    server_name lans-style.by;
    ssl_certificate /etc/letsencrypt/live/lans-style.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lans-style.by/privkey.pem;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;
    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ { proxy_pass http://server:5000/uploads/; expires 30d; }
    location /product/ {
        if ($serve_share) { rewrite ^/product/(.+)$ /api/share/product/$1 last; }
        try_files $uri /index.html;
    }
    location / { try_files $uri $uri/ /index.html; }
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
