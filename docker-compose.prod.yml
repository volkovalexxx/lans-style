services:
  postgres:
    image: postgres:16-alpine
    container_name: lans_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lans_style
      POSTGRES_USER: lans
      POSTGRES_PASSWORD: lans_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    container_name: lans_server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lans:lans_secret@postgres:5432/lans_style
      PORT: 5000
      JWT_SECRET: lans-jwt-secret-prod
      ADMIN_LOGIN: lans-admin
      ADMIN_PASSWORD: n3I2D~uVU
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: 8625164504:AAF1PGjomSfow53IBJ2Lyax0bxDiPLSvghA
      TELEGRAM_ADMIN_IDS: "7506120714"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "465"
      SMTP_USER: opt.lansstyle@gmail.com
      SMTP_PASS: cfxfxopbxgupkuex
      EMAIL_FROM: "Lans Style <opt.lansstyle@gmail.com>"
      R2_BUCKET: lans-style-stage-images
      R2_ENDPOINT: https://3a0e534dffab63814ed6ed620bff4d54.r2.cloudflarestorage.com
      R2_ACCESS_KEY_ID: a1485c3d4710d3ae8a53a185ab5e7e93
      R2_SECRET_ACCESS_KEY: 1d4c0705d9da6becfd1d476f575bf3d446a7b909b4f96733672edc71ae477803
      R2_PUBLIC_BASE_URL: https://cdn.lans-style.by
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      - postgres
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    container_name: lans_client
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - server
volumes:
  pgdata:
